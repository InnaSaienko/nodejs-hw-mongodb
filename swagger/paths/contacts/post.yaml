tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create a contact'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
          - userId
          - photo
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'John Doe'
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: '345-567-8899'
          email:
            description: "Contact's email (optional)"
            type: string
            example: 'johnDoe@test.com'
          isFavourite:
            description: "Is contact in favourites"
            type: boolean
            example: false
          contactType:
            description: "Type of contact"
            type: string
            enum: ['work', 'home', 'personal']
            example: 'personal'
          photo:
            description: "Contact's photo file"
            type: string
            format: binary
responses:
  '201':
    $ref: ../../components/responses/201.yaml
  '401':
    $ref: '../../components/responses/401.yaml'
