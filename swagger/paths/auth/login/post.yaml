tags:
  - Auth
summary: Login user
operationId: loginUser
description: 'Authenticate of user with email and password and receive access token'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            type: string
            format: email
            example: "example@test.com"
          password:
            type: string
            example: "password"
security: []
responses:
  '200':
    description: Successfully logged in user
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: "Successfully logged in an user!"
            data:
              type: object
              properties:
                accessToken:
                  type: string
                  example: "FYTRF;kpqm+JJLJkllh9o(KLL:j;ll;KPOJKHkhjlg"
  '401':
    $ref: '../../../components/responses/401.yaml'